# Alembic reads this file for "alembic upgrade head". The database URL is not
# here, env.py takes it from the backend so the password stays in the
# environment.

[alembic]
script_location = %(here)s/app/db/migrations
# The backend is not an installed package, so env.py finds "app" from here.
prepend_sys_path = %(here)s
path_separator = os

# Print each applied revision, so the log of backend-migrate shows what ran.
[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
