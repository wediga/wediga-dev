[project]
name = "wediga-backend"
version = "0.1.0"
description = "FastAPI backend for the wediga.dev portfolio site"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "authlib>=1.9.1",
    "cryptography>=49.0.0",
    "fastapi>=0.142.2",
    "httpx2>=2.16.0",
    "itsdangerous>=2.2.0",
    "joserfc>=1.7.7",
    "pyotp>=2.10.0",
    "python-multipart>=0.0.32",
    "qrcode>=8.2",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.0.3",
    "ruff>=0.17.1",
]

# ruff's default rules, plus exception chaining and named constants instead of
# bare numbers in comparisons. Tests compare against literal status codes on
# purpose, so the second rule only applies to the application code.
[tool.ruff.lint]
extend-select = ["B904", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

# The setup script of the test authentik is checked along with the backend.
[tool.pyright]
include = [".", "../deploy/authentik-test"]
exclude = [".venv"]
