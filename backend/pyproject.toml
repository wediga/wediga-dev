[project]
name = "wediga-backend"
version = "0.1.0"
description = "FastAPI backend for the wediga.dev portfolio site"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=49.0.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "pyotp>=2.10.0",
    "python-multipart>=0.0.32",
    "qrcode>=8.2",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
