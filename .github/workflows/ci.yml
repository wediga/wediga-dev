name: CI

# Least-privilege token: the workflow only checks out, tests and builds,
# it never writes back to the repository.
permissions:
  contents: read

# Monorepo CI for the wediga.dev relaunch. A leading "changes" job detects
# which project changed, then the backend and frontend jobs run only when
# their files were touched.
#
# Phase 1 has no server-deploy step on purpose, so the live wediga-dev
# container stays untouched. Automatic server deployment is wired up in a
# later phase.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      authentik: ${{ steps.filter.outputs.authentik }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'deploy/Dockerfile.backend'
              - 'deploy/authentik-test/*.py'
              - 'pyrightconfig.json'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'deploy/Dockerfile.frontend'
              - '.github/workflows/ci.yml'
            authentik:
              - 'deploy/authentik/**'
              - 'deploy/authentik-test/**'
              - 'deploy/quadlet/authentik-*'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # The setup script of the test authentik follows the backend's rules.
      - name: Check formatting
        run: uv run ruff format --check --config pyproject.toml . ../deploy/authentik-test

      - name: Lint
        run: uv run ruff check --config pyproject.toml . ../deploy/authentik-test

      # Pyright reads pyrightconfig.json in the repository root, so it runs
      # from there. --warnings fails the job on warnings too.
      - name: Type check
        run: uv run --project backend pyright --warnings
        working-directory: .

      - name: Run tests
        run: uv run pytest

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Check CI and the image run the same Node version
        run: bash ../deploy/check-node-version.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  # End-to-end tests boot the real stack (backend plus the Next.js production
  # build) and drive the critical flows through the browser, so the job needs
  # both the Python toolchain (the backend runs via uv) and Node. It runs when
  # either side changed, because an integration break can come from either.
  # The test authentik from deploy/authentik-test runs next to it, with the
  # same images and blueprint as production, so the job also runs when its
  # setup changed.
  e2e:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.authentik == 'true'
    runs-on: ubuntu-latest
    env:
      AUTHENTIK_URL: http://localhost:9000
      AUTHENTIK_ACCOUNTS: ${{ github.workspace }}/frontend/e2e/.tmp/authentik-accounts.json
    steps:
      - uses: actions/checkout@v7

      - name: Check the test authentik runs the production images
        run: bash deploy/authentik-test/check-images.sh

      # Started first, so authentik boots while the toolchains install.
      - name: Start the test authentik
        run: docker compose up -d
        working-directory: deploy/authentik-test

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --frozen
        working-directory: backend

      - name: Set up the test authentik
        run: uv run --project backend python deploy/authentik-test/setup.py

      - name: Run end-to-end tests
        run: npm run e2e
        working-directory: frontend
        env:
          # The admin password comes from the environment, never from code.
          E2E_ADMIN_PASSWORD: e2e-admin-password

      - name: Show the test authentik's logs
        if: failure()
        run: docker compose logs
        working-directory: deploy/authentik-test

  # A single stable check for branch protection. It passes when every test job
  # either succeeded or was skipped (path filter), and fails if any failed or
  # was cancelled. Requiring this one check gates a merge on the tests without
  # blocking doc-only PRs where the path-filtered jobs do not run.
  ci-success:
    needs: [changes, backend, frontend, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no CI job failed
        run: |
          for r in "${{ needs.changes.result }}" "${{ needs.backend.result }}" "${{ needs.frontend.result }}" "${{ needs.e2e.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "a CI job did not pass: $r"
              exit 1
            fi
          done
          echo "all CI jobs passed or were skipped"
