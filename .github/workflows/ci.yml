name: CI

# Least-privilege token: the workflow only checks out, tests and builds,
# it never writes back to the repository.
permissions:
  contents: read

# Monorepo CI for the wediga.dev relaunch. A leading "changes" job detects
# which project changed, then the backend and frontend jobs run only when
# their files were touched.
#
# Phase 1 has no server-deploy step on purpose, so the live wediga-dev
# container stays untouched. Automatic server deployment is wired up in a
# later phase.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'deploy/Dockerfile.backend'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'deploy/Dockerfile.frontend'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # End-to-end tests boot the real stack (backend plus the Next.js production
  # build) and drive the critical flows through the browser, so the job needs
  # both the Python toolchain (the backend runs via uv) and Node. It runs when
  # either side changed, because an integration break can come from either.
  e2e:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --frozen
        working-directory: backend

      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run end-to-end tests
        run: npm run e2e
        working-directory: frontend
        env:
          # The admin password comes from the environment, never from code.
          E2E_ADMIN_PASSWORD: e2e-admin-password
