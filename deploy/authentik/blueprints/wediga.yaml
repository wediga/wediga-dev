# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# The parts of the authentik setup that are specific to this site. authentik
# reads this file from /blueprints/custom and brings the listed objects to the
# described state, on startup and whenever the file changes.
#
# Everything listed here is owned by this file: a change made by hand in the
# admin interface is reverted the next time the file is applied. Accounts,
# passwords and second factors are not part of it and only live in the database.
#
# The recovery flow itself comes from the example blueprint that ships with
# authentik (example/flows-recovery-email-verification.yaml). On a fresh install
# that one has to be applied once in the admin interface before this file can
# attach the second-factor step to it.
#
# The login of wediga.dev (provider, application and its logout flow) lives
# here as well. Its client secret is read from the environment, so authentik
# needs WEDIGA_OIDC_CLIENT_SECRET set before it applies this file.
version: 1
metadata:
  name: wediga.dev - groups, second factor, recovery and login
entries:
  # Wait for the flows and the brand this file refers to. Without the brand, a
  # fresh install would create it below without its default flows.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Authentication flow
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - TOTP MFA setup flow
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - WebAuthn MFA setup flow
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Brand
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider authorization flow (implicit consent)
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Invalidation flow
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: System - OAuth2 Provider - Scopes
      required: false

  # Groups. Neither grants any rights inside authentik. Applications map them
  # to their own roles.
  - model: authentik_core.group
    identifiers:
      name: wediga-admins
    attrs:
      is_superuser: false
  - model: authentik_core.group
    identifiers:
      name: friends
    attrs:
      is_superuser: false

  # A second factor is mandatory for everyone. Whoever has none yet has to set
  # one up during login, as an authenticator app or a security key. SMS, email
  # and Duo are not accepted.
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    identifiers:
      name: default-authentication-mfa-validation
    attrs:
      not_configured_action: configure
      device_classes:
        - static
        - totp
        - webauthn
      configuration_stages:
        - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
        - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]

  # The same step sits in the recovery flow, before the new password is set.
  # A recovery link on its own can then neither sign in nor change a password.
  - model: authentik_flows.flowstagebinding
    conditions:
      - !Find [authentik_flows.flow, [slug, default-recovery-flow]]
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-recovery-flow]]
      stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, default-authentication-mfa-validation]]
      order: 25
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: any
      invalid_response_action: retry

  # English as the default interface language, and the recovery flow that the
  # admin's recovery links use.
  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
    attrs:
      flow_recovery: !Find [authentik_flows.flow, [slug, default-recovery-flow]]
      attributes:
        settings:
          locale: en

  # Logging out of wediga.dev ends the authentik session as well and then
  # returns to the public site. The built-in provider logout flow has no stage
  # and would keep the authentik session alive.
  - model: authentik_stages_redirect.redirectstage
    id: wediga-dev-logout-redirect
    identifiers:
      name: wediga-dev-logout-redirect
    attrs:
      mode: static
      target_static: https://www.wediga.dev/
  - model: authentik_flows.flow
    id: wediga-dev-logout-flow
    identifiers:
      slug: wediga-dev-logout
    attrs:
      name: wediga.dev logout
      title: Logout
      designation: invalidation
      authentication: none
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf wediga-dev-logout-flow
      stage: !Find [authentik_stages_user_logout.userlogoutstage, [name, default-invalidation-logout]]
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf wediga-dev-logout-flow
      stage: !KeyOf wediga-dev-logout-redirect
      order: 20

  # The login of wediga.dev itself. The backend exchanges the code for tokens,
  # so only the authorization code grant is allowed. Tokens are signed with
  # authentik's own key instead of the client secret, and the secret comes
  # from authentik.env. Redirect URIs are still empty, and authentik rejects
  # every login until they are set.
  - model: authentik_providers_oauth2.oauth2provider
    id: wediga-dev-provider
    identifiers:
      name: wediga.dev
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !KeyOf wediga-dev-logout-flow
      client_type: confidential
      client_id: wediga-dev
      client_secret: !Env WEDIGA_OIDC_CLIENT_SECRET
      grant_types:
        - authorization_code
      redirect_uris: []
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    id: wediga-dev-application
    identifiers:
      slug: wediga-dev
    attrs:
      name: wediga.dev
      provider: !KeyOf wediga-dev-provider
      policy_engine_mode: any

  # Only the two groups may use it. authentik turns away any other account
  # before it reaches wediga.dev, which checks the groups again on its own.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf wediga-dev-application
      group: !Find [authentik_core.group, [name, wediga-admins]]
      order: 10
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf wediga-dev-application
      group: !Find [authentik_core.group, [name, friends]]
      order: 20
