# Compose file for the two-container setup behind the existing Caddy proxy.
# Run from the deploy/ directory. Build contexts point at the sibling
# project directories (../backend and ../frontend).
#
# Only the frontend joins the external "proxy" network that the live Caddy
# reverse proxy uses. The backend stays on the default internal network and
# is reachable by the frontend server-side via the service name "backend".
# The browser only ever sees the frontend origin, so the backend needs no
# public Caddy entry.

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    restart: unless-stopped
    # Drop all Linux capabilities and forbid privilege escalation. The FastAPI
    # process binds container port 8000 and needs nothing above port 1024, so
    # no capability has to be added back.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - "ALL"
    # The root filesystem is read-only. The SQLite file lives in the mounted
    # data volume, which stays writable, and /tmp is a tmpfs for transient
    # scratch files.
    read_only: true
    tmpfs:
      - /tmp
    # Pin the database to the mounted volume. Without this, paths.py derives
    # the path from the repository root, which resolves to /data inside the
    # image rather than the mounted /app/data, and its mkdir would fail under
    # read_only.
    environment:
      - WEDIGA_DB_PATH=/app/data/wediga.db
    # The future SQLite file lives here, mounted from the gitignored data/
    # directory. Nothing is created in Phase 1.
    volumes:
      - ../data:/app/data
    # No host port is published. The live wediga-dev container already uses
    # host port 8001, so binding it here would clash. The frontend reaches
    # the backend over the internal network on container port 8000.
    networks:
      - default

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend
    # The frontend reaches the backend server-side over the internal network.
    # Without this the URL would fall back to localhost and resolve to the
    # frontend container itself, breaking the admin guard and every read.
    environment:
      - BACKEND_URL=http://backend:8000
    # Drop all Linux capabilities and forbid privilege escalation. The Next.js
    # standalone server binds container port 3000 and needs no capability above
    # port 1024.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - "ALL"
    # The root filesystem is read-only. The standalone server only writes to
    # transient scratch under /tmp and to its on-disk cache under
    # /app/.next/cache, both backed by tmpfs.
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    # Reachable from the existing Caddy on the proxy network as
    # "frontend:3000". No host port is published.
    networks:
      - default
      - proxy

networks:
  default:
  proxy:
    external: true
